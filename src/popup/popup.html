<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Story Studio TTS</title>
    <!-- Set an initial theme from the OS to avoid a light flash; the stored
         preference is applied a moment later once settings load. -->
    <script>
      document.documentElement.setAttribute(
        'data-theme',
        matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      );
    </script>
  </head>
  <body>
    <header>
      <div class="header-brand">
        <h1>Story Studio TTS</h1>
        <span id="extensionVersion" class="version-badge" title="Installed extension version"></span>
      </div>
      <div class="header-actions">
        <button id="whatsNew" class="link small whats-new" title="What changed recently">✨ What's new<span id="whatsNewDot" class="ndot" hidden></span></button>
        <button id="openOptions" class="link settings-gear" title="Open settings" aria-label="Open settings">⚙</button>
      </div>
    </header>

    <label>Provider
      <select id="provider">
        <option value="fish">fish.audio</option>
        <option value="elevenlabs_web">ElevenLabs (web — no key)</option>
        <option value="elevenlabs">ElevenLabs (API key)</option>
        <option value="openai">OpenAI TTS (paid 💲)</option>
      </select>
    </label>
    <p id="providerNote" class="muted"></p>
    <div class="row end open-provider-row">
      <button id="openProviderPage" class="link small" title="Open this provider's page in a tab" hidden>↗ Open provider</button>
    </div>

    <!-- Companion mode: pick from a running Story Studio server -->
    <section id="companionPane" hidden>
      <div class="row between">
        <button id="testConn" class="link">Test connection</button>
        <span id="connStatus" class="muted"></span>
      </div>
      <label>Project
        <select id="project"></select>
      </label>
      <label>Episode <span class="muted" id="episodeHint">(script done, audio missing)</span>
        <select id="episode"></select>
      </label>
      <label class="check">
        <input type="checkbox" id="showDoneEpisodes" />
        Show episodes that already have all audio
      </label>
      <label class="check">
        <input type="checkbox" id="includeExisting" />
        Include chapters that already have audio (re-voice)
      </label>

      <div class="row between section-head">
        <span class="muted" id="sectionsSummary">Chapters / Intro</span>
        <div class="hgroup">
          <button id="reloadSections" class="link small" title="Re-pull chapters + audio status from Story Studio">⟳ Reload</button>
          <label class="check"><input type="checkbox" id="selectAll" /> all</label>
        </div>
      </div>
      <div id="sectionList" class="sectionlist"></div>
    </section>

    <!-- Paste mode: free text -->
    <section id="pastePane" hidden>
      <label>Episode code (for filename)
        <input id="pasteCode" placeholder="e.g. TN0005" />
      </label>
      <label>Label
        <input id="pasteLabel" placeholder="e.g. 03 Chapter" />
      </label>
      <label>Script text
        <textarea id="pasteText" rows="8" placeholder="Paste the narration here…"></textarea>
      </label>
    </section>

    <label>Voice
      <div class="row">
        <select id="voice"></select>
        <button id="loadVoices" title="Load voices from the provider">↻</button>
      </div>
    </label>

    <!-- Provider / model-specific voice tuning -->
    <section id="voiceSettings" class="vs-card" hidden>
      <div class="row between vs-head">
        <span class="muted small">Voice settings</span>
        <button id="vsReset" class="link small" title="Reset to defaults">Reset</button>
      </div>

      <label id="vsModelRow" class="vs-model">Model
        <select id="vsModel"></select>
      </label>

      <div id="vsStabilityRow" class="vs-row">
        <div class="row between"><span class="mini">Stability</span><span id="vsStabilityVal" class="mini"></span></div>
        <input id="vsStability" type="range" min="0" max="1" step="0.05" />
        <select id="vsStabilityMode" hidden></select>
      </div>

      <div id="vsSimilarityRow" class="vs-row">
        <div class="row between"><span class="mini">Similarity</span><span id="vsSimilarityVal" class="mini"></span></div>
        <input id="vsSimilarity" type="range" min="0" max="1" step="0.05" />
      </div>

      <div id="vsStyleRow" class="vs-row">
        <div class="row between"><span class="mini">Style exaggeration</span><span id="vsStyleVal" class="mini"></span></div>
        <input id="vsStyle" type="range" min="0" max="1" step="0.05" />
      </div>

      <div id="vsSpeedRow" class="vs-row">
        <div class="row between"><span class="mini">Speed</span><span id="vsSpeedVal" class="mini"></span></div>
        <input id="vsSpeed" type="range" min="0.7" max="1.2" step="0.05" />
      </div>

      <label class="check" id="vsSpeakerBoostRow"><input type="checkbox" id="vsSpeakerBoost" /> Speaker boost</label>
    </section>

    <label id="saveTargetLabel">Save to
      <select id="saveTarget">
        <option value="project">Story Studio project folder</option>
        <option value="download">Downloads folder</option>
      </select>
    </label>

    <label class="check" id="autoTagLabel">
      <input type="checkbox" id="autoTag" />
      Auto-tag emotions &amp; pauses (Fish "Auto Tag All")
    </label>

    <div class="row">
      <span id="filenamePreview" class="muted"></span>
    </div>

    <button id="generate" class="primary">Generate &amp; save</button>
    <button id="queueSelected" class="primary" hidden>Queue selected</button>
    <button id="queueEpisode" hidden>Queue this episode's audio</button>
    <button id="queueProject" hidden>Queue all pending (whole project)</button>

    <!-- Human pace — a randomised gap between generations so a web session
         (fish.audio / ElevenLabs) is never flooded -->
    <section class="pace-card">
      <div class="row between">
        <span class="muted small">Human pace <span class="muted">· gap between generations</span></span>
        <span id="humanPaceState" class="pace-state" aria-live="polite"></span>
      </div>
      <select id="humanPacePreset">
        <option value="off">Off (no delay)</option>
        <option value="quick">Quick (2–5s)</option>
        <option value="balanced">Balanced (5–12s) — recommended</option>
        <option value="cautious">Cautious (15–40s)</option>
        <option value="custom">Custom</option>
      </select>
      <div id="humanPaceCustom" class="row pace-custom" hidden>
        <label class="grow"><span class="mini">Min seconds</span>
          <input id="humanPaceMin" type="number" min="0" max="3600" step="1" /></label>
        <label class="grow"><span class="mini">Max seconds</span>
          <input id="humanPaceMax" type="number" min="0" max="3600" step="1" /></label>
      </div>
    </section>

    <!-- Live queue status: Idle / Queued / Generating / Paused / Finished -->
    <div id="genStatusBar" class="genstatus idle">
      <span class="gs-state"><span class="gs-dot"></span><span id="gsStateText">Idle</span></span>
      <span id="gsCounts" class="gs-counts" hidden>
        <span class="gs-done" id="gsDone">0 done</span>
        <span class="gs-failed" id="gsFailed">0 failed</span>
        <span class="gs-left" id="gsLeft">0 left</span>
      </span>
    </div>

    <div id="queueControls" class="row between queue-controls" hidden>
      <span id="queueInfo" class="muted small"></span>
      <div class="hgroup">
        <button id="pauseQueue" class="link small" hidden>Pause</button>
        <button id="retryFailed" class="link small" hidden>Retry failed</button>
        <button id="clearQueue" class="link small">Clear pending</button>
      </div>
    </div>
    <ul id="queueList" class="queuelist" hidden></ul>

    <p id="status" class="muted"></p>

    <!-- What's new — renders CHANGELOG.md packaged with the extension -->
    <div id="whatsNewModal" class="overlay" hidden>
      <div class="dialog wide">
        <div class="row between">
          <div class="dlgtitle">What's new</div>
          <button id="whatsNewClose" class="link" aria-label="Close">✕</button>
        </div>
        <div id="whatsNewBody" class="changelog"></div>
      </div>
    </div>

    <!-- Styled confirmation (replaces the native confirm popup) -->
    <div id="confirm" class="overlay" hidden>
      <div class="dialog">
        <div class="dlgtitle" id="confirmTitle"></div>
        <div class="muted" id="confirmBody"></div>
        <div class="row end">
          <button id="confirmCancel">Cancel</button>
          <button id="confirmOk" class="primary">Queue</button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
