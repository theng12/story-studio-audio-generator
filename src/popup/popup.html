<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Story Studio Audio Generator</title>
  </head>
  <body>
    <header>
      <h1>Story Studio Audio Generator → Story Studio</h1>
      <button id="openOptions" class="link" title="Settings">⚙</button>
    </header>

    <!-- Companion mode: pick from a running Story Studio server -->
    <section id="companionPane" hidden>
      <label>Project
        <select id="project"></select>
      </label>
      <label>Episode <span class="muted">(script done, audio missing)</span>
        <select id="episode"></select>
      </label>
      <label>Chapter / Intro <span class="muted">(missing audio only)</span>
        <select id="chapter"></select>
      </label>
    </section>

    <!-- Paste mode: free text -->
    <section id="pastePane" hidden>
      <label>Episode code (for filename)
        <input id="pasteCode" placeholder="e.g. TN0005" />
      </label>
      <label>Label
        <input id="pasteLabel" placeholder="e.g. 03 Chapter" />
      </label>
      <label>Script text
        <textarea id="pasteText" rows="8" placeholder="Paste the narration here…"></textarea>
      </label>
    </section>

    <label>Voice
      <div class="row">
        <select id="voice"></select>
        <button id="loadVoices" title="Load voices from fish.audio">↻</button>
      </div>
    </label>

    <label id="saveTargetLabel">Save to
      <select id="saveTarget">
        <option value="project">Story Studio project folder</option>
        <option value="download">Downloads folder</option>
      </select>
    </label>

    <label class="check">
      <input type="checkbox" id="autoTag" />
      Auto-tag emotions &amp; pauses (Fish "Auto Tag All")
    </label>

    <div class="row">
      <span id="filenamePreview" class="muted"></span>
    </div>

    <button id="generate" class="primary">Generate &amp; save</button>
    <button id="generateAll" hidden>Generate all chapters</button>
    <p id="status" class="muted"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
